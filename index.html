<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>تست اتصال — چارسو</title>
<style>
  :root{color-scheme:light dark}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#f4f4f2;color:#17171b;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    line-height:1.9;padding:1.5rem;
  }
  @media (prefers-color-scheme:dark){body{background:#111113;color:#ededeb}}
  .card{max-width:30rem;width:100%;text-align:center}
  .tick{
    width:72px;height:72px;margin:0 auto 1.2rem;border-radius:50%;
    background:#2e7d32;display:grid;place-items:center;
    color:#fff;font-size:2.4rem;line-height:1;
  }
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{margin:0 0 1rem;color:#5c5c64}
  @media (prefers-color-scheme:dark){p{color:#a0a0a7}}
  .stats{
    margin-top:1.6rem;border-top:1px solid #dcdcd6;padding-top:1rem;
    display:grid;gap:.5rem;font-size:.9rem;
  }
  @media (prefers-color-scheme:dark){.stats{border-color:#2c2c32}}
  .row{display:flex;justify-content:space-between;gap:1rem}
  .row b{font-variant-numeric:tabular-nums;font-weight:600}
  .hint{font-size:.82rem;color:#8b8b92;margin-top:1.4rem}
  .img{margin-top:1.2rem}
  .img img{width:100%;max-width:220px;border-radius:4px;display:block;margin:0 auto}
  .img figcaption{font-size:.8rem;color:#8b8b92;margin-top:.4rem}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>صفحه با موفقیت باز شد</h1>
  <p>یعنی GitHub Pages از اینترنت شما در دسترس است.</p>

  <div class="stats">
    <div class="row"><span>زمان بارگذاری</span><b id="t">…</b></div>
    <div class="row"><span>بارگذاری تصویر</span><b id="i">…</b></div>
    <div class="row"><span>تاریخ و ساعت</span><b id="d">…</b></div>
  </div>

  <figure class="img">
    <img id="pic" alt="تصویر آزمایشی"
         src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMjAgOTAiPjxyZWN0IHdpZHRoPSIyMjAiIGhlaWdodD0iOTAiIGZpbGw9IiNDODNBNEQiLz48dGV4dCB4PSIxMTAiIHk9IjU1IiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC1zaXplPSIyNiIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Y2hhcnNvbzwvdGV4dD48L3N2Zz4=">
    <figcaption>اگر این مستطیل قرمز را می‌بینید، تصاویر هم درست بارگذاری می‌شوند.</figcaption>
  </figure>

  <p class="hint">
    لطفاً از این صفحه عکس بگیرید و بفرستید.<br>
    بدون فیلترشکن امتحان کنید.
  </p>
</div>

<script>
  const ms = n => !n || n < 1 ? "کمتر از ۱ میلی‌ثانیه"
               : n < 1000 ? Math.round(n) + " میلی‌ثانیه"
                          : (n / 1000).toFixed(1) + " ثانیه";
  addEventListener("load", () => {
    const nav = performance.getEntriesByType("navigation")[0];
    const t = nav ? (nav.duration || nav.responseEnd - nav.startTime) : performance.now();
    document.getElementById("t").textContent = ms(t);
    const img = performance.getEntriesByName(document.getElementById("pic").src)[0];
    document.getElementById("i").textContent = img && img.duration ? ms(img.duration) : "فوری";
    document.getElementById("d").textContent =
      new Date().toLocaleString("fa-IR", { dateStyle: "short", timeStyle: "short" });
  });
</script>
</body>
</html>
